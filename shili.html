<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级感任务卡片设计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义复选框的平滑过渡动画 */
        .custom-checkbox input:checked + div {
            background-color: #3b82f6; /* blue-500 */
            border-color: #3b82f6;
        }
        .custom-checkbox input:checked + div svg {
            opacity: 1;
            transform: scale(1);
        }
        .custom-checkbox div svg {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4 sm:p-8 font-sans antialiased text-gray-900">

    <!-- 主卡片容器：使用柔和的阴影替代生硬的边框 -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl shadow-gray-200/40 border border-gray-100 p-6 sm:p-8 transition-shadow duration-300 hover:shadow-2xl hover:shadow-gray-200/50">
        
        <!-- 顶部：主任务标题与操作区 -->
        <div class="flex items-start justify-between group/main">
            <div class="flex items-start gap-4">
                <!-- 主任务复选框 -->
                <label class="custom-checkbox relative flex items-center justify-center cursor-pointer mt-1">
                    <input type="checkbox" class="sr-only">
                    <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center transition-colors duration-200 hover:border-blue-400">
                        <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </label>
                
                <div>
                    <h1 class="text-xl font-semibold text-gray-800 tracking-tight">学习新概念</h1>
                    
                    <!-- 元信息：时间与进度 -->
                    <div class="flex items-center gap-4 mt-2.5">
                        <div class="flex items-center gap-1.5 text-sm text-gray-500">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span>今天</span>
                        </div>
                        
                        <!-- 进度标签：胶囊样式，提升精致度 -->
                        <div class="flex items-center gap-1.5 bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md text-xs font-medium">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                            </svg>
                            <span>0 / 2</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧操作图标：默认颜色较淡，Hover时加深，垃圾桶变红 -->
            <div class="flex items-center gap-1 text-gray-400">
                <button class="p-2 rounded-lg hover:bg-gray-100 hover:text-gray-700 transition-colors" title="详情">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
                    </svg>
                </button>
                <button class="p-2 rounded-lg hover:bg-gray-100 hover:text-gray-700 transition-colors" title="更多">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                    </svg>
                </button>
                <button class="p-2 rounded-lg hover:bg-red-50 hover:text-red-500 transition-colors" title="删除">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 分割线与子任务区域间距 -->
        <div class="mt-8">
            <!-- 子任务 Header -->
            <div class="flex items-center justify-between mb-3 px-1">
                <h3 class="text-sm font-medium text-gray-700">子任务</h3>
                <button class="flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    添加子任务
                </button>
            </div>

            <!-- 子任务列表：去除边框，使用 Hover 背景色 -->
            <div class="space-y-1">
                <!-- 子任务项 1 -->
                <div class="group flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors cursor-pointer">
                    <div class="flex items-center gap-3">
                        <label class="custom-checkbox relative flex items-center justify-center cursor-pointer">
                            <input type="checkbox" class="sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center transition-colors duration-200 hover:border-blue-400">
                                <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </label>
                        <span class="text-gray-700 text-sm">11</span>
                    </div>
                    <!-- 删除按钮：默认透明，Hover 时浮现，减少视觉噪音 -->
                    <button class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 transition-all rounded-md hover:bg-red-50">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- 子任务项 2 -->
                <div class="group flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors cursor-pointer">
                    <div class="flex items-center gap-3">
                        <label class="custom-checkbox relative flex items-center justify-center cursor-pointer">
                            <input type="checkbox" class="sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center transition-colors duration-200 hover:border-blue-400">
                                <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </label>
                        <span class="text-gray-700 text-sm">111</span>
                    </div>
                    <!-- 删除按钮：默认透明，Hover 时浮现 -->
                    <button class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 transition-all rounded-md hover:bg-red-50">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
    </div>

</body>
</html>
