<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级感任务卡片 - 优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #F8FAFC; 
        }
        .smooth-transition {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="checkbox"] { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-3xl bg-white rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100/50 p-6 sm:p-8 smooth-transition hover:shadow-[0_12px_40px_rgb(0,0,0,0.08)]">
        
        <!-- ================= 顶部主任务区域 (保持圆环，代表大目标) ================= -->
        <div class="flex items-start justify-between group/header">
            <div class="flex items-start sm:items-center gap-4">
                
                <!-- 父任务：圆形 (rounded-full)，使用柔和的玫瑰色 -->
                <label class="relative flex items-center justify-center w-6 h-6 mt-1 sm:mt-0 rounded-full border-[2.5px] border-rose-300 cursor-pointer smooth-transition hover:bg-rose-50 hover:border-rose-400 group/checkbox">
                    <input type="checkbox" onchange="toggleMainTask(this)">
                    <i data-lucide="check" class="w-3.5 h-3.5 text-rose-500 opacity-0 scale-50 smooth-transition group-hover/checkbox:opacity-50 check-icon"></i>
                </label>

                <div>
                    <h1 class="text-xl font-semibold text-gray-900 tracking-tight smooth-transition" id="main-title">学习新概念</h1>
                    
                    <div class="flex flex-wrap items-center gap-3 mt-2.5">
                        <div class="flex items-center gap-1.5 text-sm text-gray-500">
                            <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i>
                            <span>今天</span>
                        </div>
                        
                        <!-- 进度标签：颜色调柔和，不再使用刺眼的纯绿 -->
                        <div class="flex items-center gap-1.5 text-sm font-medium text-emerald-700 bg-emerald-50/80 px-2.5 py-0.5 rounded-full border border-emerald-100/50">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-500"></i>
                            <span>2 / 2</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1 opacity-40 group-hover/header:opacity-100 smooth-transition">
                <button class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-xl smooth-transition"><i data-lucide="list" class="w-5 h-5"></i></button>
                <button class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-xl smooth-transition"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
                <button class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-xl smooth-transition"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="h-px w-full bg-gray-100 my-6"></div>

        <!-- ================= 子任务区域 (改为微圆角方框，代表拆解的清单) ================= -->
        <div class="pl-10">
            
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-medium text-gray-400">子任务清单</h2>
                <button class="flex items-center gap-1.5 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-lg smooth-transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    添加子任务
                </button>
            </div>

            <div class="space-y-1">
                
                <!-- 子任务项 1：已完成状态演示 -->
                <label class="flex items-center justify-between p-2.5 -mx-2.5 rounded-xl hover:bg-gray-50/80 cursor-pointer smooth-transition group">
                    <div class="flex items-center gap-3">
                        <!-- 子任务：微圆角方框 (rounded-[6px])，完成状态使用高级的 emerald-500 -->
                        <div class="relative flex items-center justify-center w-5 h-5 rounded-[6px] border-2 border-emerald-500 bg-emerald-500 smooth-transition checkbox-box">
                            <input type="checkbox" checked onchange="toggleSubTask(this)">
                            <i data-lucide="check" class="w-3 h-3 text-white opacity-100 scale-100 smooth-transition check-icon"></i>
                        </div>
                        <!-- 完成后的文字：变为浅灰色并加上删除线，不再抢夺视觉焦点 -->
                        <span class="text-gray-400 line-through smooth-transition task-text">11</span>
                    </div>
                    <!-- 移除了右侧刺眼的“已完成”文字，保持干净留白 -->
                </label>

                <!-- 子任务项 2：未完成状态演示 -->
                <label class="flex items-center justify-between p-2.5 -mx-2.5 rounded-xl hover:bg-gray-50/80 cursor-pointer smooth-transition group">
                    <div class="flex items-center gap-3">
                        <!-- 未完成的方框：浅灰色边框，Hover时边框变色暗示可点击 -->
                        <div class="relative flex items-center justify-center w-5 h-5 rounded-[6px] border-2 border-gray-200 smooth-transition group-hover:border-emerald-400 group-hover:bg-emerald-50 checkbox-box">
                            <input type="checkbox" onchange="toggleSubTask(this)">
                            <i data-lucide="check" class="w-3 h-3 text-white opacity-0 scale-50 smooth-transition check-icon"></i>
                        </div>
                        <span class="text-gray-600 group-hover:text-gray-900 smooth-transition task-text">111</span>
                    </div>
                </label>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 父任务交互逻辑
        function toggleMainTask(checkbox) {
            const icon = checkbox.nextElementSibling;
            const title = document.getElementById('main-title');
            const parent = checkbox.parentElement;
            
            if (checkbox.checked) {
                icon.classList.remove('opacity-0', 'scale-50', 'group-hover/checkbox:opacity-50', 'text-rose-500');
                icon.classList.add('opacity-100', 'scale-100', 'text-white');
                parent.classList.add('bg-rose-400', 'border-rose-400');
                parent.classList.remove('border-rose-300', 'hover:bg-rose-50');
                title.classList.add('line-through', 'text-gray-400');
            } else {
                icon.classList.add('opacity-0', 'scale-50', 'group-hover/checkbox:opacity-50', 'text-rose-500');
                icon.classList.remove('opacity-100', 'scale-100', 'text-white');
                parent.classList.remove('bg-rose-400', 'border-rose-400');
                parent.classList.add('border-rose-300', 'hover:bg-rose-50');
                title.classList.remove('line-through', 'text-gray-400');
            }
        }

        // 子任务交互逻辑 (适配了方框和高级绿)
        function toggleSubTask(checkbox) {
            const icon = checkbox.nextElementSibling;
            const text = checkbox.closest('label').querySelector('.task-text');
            const box = checkbox.closest('.checkbox-box');

            if (checkbox.checked) {
                // 选中状态：高级翠绿 (Emerald)
                icon.classList.remove('opacity-0', 'scale-50');
                icon.classList.add('opacity-100', 'scale-100');
                box.classList.add('bg-emerald-500', 'border-emerald-500');
                box.classList.remove('border-gray-200', 'group-hover:border-emerald-400', 'group-hover:bg-emerald-50');
                text.classList.add('line-through', 'text-gray-400');
                text.classList.remove('text-gray-600', 'group-hover:text-gray-900');
            } else {
                // 取消选中
                icon.classList.add('opacity-0', 'scale-50');
                icon.classList.remove('opacity-100', 'scale-100');
                box.classList.remove('bg-emerald-500', 'border-emerald-500');
                box.classList.add('border-gray-200', 'group-hover:border-emerald-400', 'group-hover:bg-emerald-50');
                text.classList.remove('line-through', 'text-gray-400');
                text.classList.add('text-gray-600', 'group-hover:text-gray-900');
            }
        }
    </script>
</body>
</html>
